[project]
name = "true-love-ai"
version = "0.2.0"
description = "True Love AI service - tl-ai"
requires-python = ">=3.12"
dependencies = [
    "true-love-common",
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-logging-loki>=0.3.1",
    # HTTP 客户端
    "httpx>=0.28.0",
    # LLM
    "openai>=2.32.0",
    # 数据验证
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # 配置
    "pyyaml>=6.0.3",
    # 数据库
    "sqlalchemy>=2.0.0",
    "python-dateutil>=2.9.0",
    # HTML 解析（汇率 skill）
    "beautifulsoup4>=4.12.0",
    "qrcode>=8.2",
    "pillow>=12.2.0",
    # Papa John's ordering
    "pajohns>=0.1.0",
    "pydantic-ai-slim[openai]>=2.55.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "httpx>=0.28.0",  # 用于测试
]

[project.scripts]
true-love-ai = "true_love_ai.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/true_love_ai"]

[tool.uv.sources]
true-love-common = { path = "../true-love-common", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["e2e: runs real tl-server and tl-ai processes (TL_E2E=0 skips them)"]
# a test whose coroutine never ran must fail, not pass silently
filterwarnings = ["error::RuntimeWarning", "error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
