# ============================================
# True Love AI - Docker Compose
# ============================================
#
# 使用方式：
#   cd /root/tl-ai
#   docker compose pull      # 拉取最新镜像
#   docker compose up -d     # 启动/更新容器
#   docker compose logs -f   # 查看日志
#   docker compose ps        # 查看状态
#   docker compose down      # 停止并删除容器
#
# ============================================
# 等效的 docker 命令：
# ============================================
#
# docker pull ghcr.io/oreoft/true-love-ai:latest
#
# docker run -d \
#   --name true-love-ai \
#   --restart unless-stopped \
#   -p 8088:8088 \
#   -v /root/tl-ai/config.yaml:/app/config.yaml:ro \
#   -v /root/tl-ai/gen_video:/app/gen_video \
#   -v /root/tl-ai/gen_audio:/app/gen_audio \
#   -v /root/tl-ai/dbs:/app/dbs \
#   -e APP_ENV=prod \
#   --health-cmd="curl -f http://localhost:8088/health || exit 1" \
#   --health-interval=30s \
#   --health-timeout=10s \
#   --health-retries=3 \
#   --health-start-period=10s \
#   --log-driver=json-file \
#   --log-opt max-size=10m \
#   --log-opt max-file=3 \
#   ghcr.io/oreoft/true-love-ai:latest
#
# ============================================

services:
  true-love-ai:
    # 镜像地址（对应 docker run 最后的镜像参数）
    image: ghcr.io/oreoft/true-love-ai:latest
    
    # 容器名称（对应 --name）
    container_name: tl-ai
    
    # 重启策略（对应 --restart）
    restart: unless-stopped

    ports:
      - "8088:8088"


    # 卷挂载（对应 -v）
    # 格式：宿主机路径:容器路径[:ro]
    volumes:
      # 配置文件（只读，CI 部署时从私有仓库 config-center 取出并放到与 true-love-n 同级的 config-center 目录；不存在时直接报错，不自动建空目录）
      - type: bind
        source: ../../config-center/true-love-n/true-love-ai/config.yaml
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
      # 生成的视频目录
      - ./gen_video:/app/gen_video
      # 生成的语音目录
      - ./gen_audio:/app/gen_audio
      # AI 数据库（用户画像、人设、技能权限、模型，容器重启不丢失）
      - ./dbs:/app/dbs
    
    # 环境变量（对应 -e）
    environment:
      - APP_ENV=prod
    
    # 健康检查（对应 --health-*）
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s      # 检查间隔
      timeout: 10s       # 超时时间
      retries: 3         # 失败重试次数
      start_period: 10s  # 启动等待时间
    
    # 日志配置（对应 --log-driver 和 --log-opt）
    logging:
      driver: "json-file"
      options:
        max-size: "10m"  # 单个日志文件最大 10MB
        max-file: "3"    # 最多保留 3 个日志文件

    # 加入与 nexu 共享的网络，使容器间可通过服务名（http://nexu:3010）互通
    networks:
      - tl-net

networks:
  tl-net:
    external: true
