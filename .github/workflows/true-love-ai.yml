name: true-love-ai Build & Deploy via Docker

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - "true-love-ai/**"
      - ".github/workflows/true-love-ai.yml"

env:
  # ========== Docker 镜像配置 ==========
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/true-love-ai
  
  # ========== ser-docker（ser-pve 上的 Debian 虚拟机）部署配置 ==========
  SERVER_IP: ${{ secrets.SER_GW_HOST }}
  SERVER_PORT: 2233
  SERVER_USER: server
  SERVER_SSH_KEY: ${{ secrets.SER_SSH_DOOR_KEY }}
  
  # ========== 通知配置 ==========
  NOTIFY_PATH: ${{ secrets.TL_NOTIFY_PATH }}
  NOTIFY_TOKEN: ${{ secrets.TL_NOTIFY_TOKEN }}
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./true-love-ai
          file: ./true-love-ai/Dockerfile
          build-contexts: |
            common=./true-love-common
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy:
    name: Deploy to ser-docker
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Fetch config from config-center
        uses: actions/checkout@v4
        with:
          repository: oreoft/config-center
          token: ${{ secrets.CONFIG_CENTER_TOKEN }}
          path: config-center
          persist-credentials: false

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ env.SERVER_SSH_KEY }}

      # The image is public, so the config never goes into it: ship it to the host before the service restarts
      - name: Upload config
        shell: bash
        run: |
          for i in 1 2 3; do
            scp -q -o StrictHostKeyChecking=no -P "${{ env.SERVER_PORT }}" \
              config-center/true-love-n/true-love-ai/config.yaml \
              "${{ env.SERVER_USER }}@${{ env.SERVER_IP }}:.tl-config-true-love-ai.yaml" && exit 0
            echo "scp attempt $i failed; retrying"
            sleep 10
          done
          exit 1

      - name: Deploy via SSH
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=no -p "${{ env.SERVER_PORT }}" "${{ env.SERVER_USER }}@${{ env.SERVER_IP }}" bash -s << 'EOF'
            set -euo pipefail
            cd ~/true-love-n/true-love-ai

            git pull --ff-only

            # Move the uploaded config to where compose mounts it; failing here leaves the running container untouched
            mkdir -p ~/config-center/true-love-n/true-love-ai
            mv -f ~/.tl-config-true-love-ai.yaml ~/config-center/true-love-n/true-love-ai/config.yaml

            docker compose pull
            # Recreate even when the image is unchanged so config-only deploys take effect
            docker compose up -d --force-recreate
            docker image prune -f
            docker compose ps
          EOF

      - name: Notify - Success
        if: success()
        run: |
          curl --location "${{ env.NOTIFY_PATH }}" \
          --header 'Content-Type: application/json' \
          --data "{
            \"token\": \"${{ env.NOTIFY_TOKEN }}\",
            \"sendReceiver\": \"master\",
            \"atReceiver\": \"\",
            \"content\": \"真爱粉ai模块(Docker)已经成功部署 🐳\"
          }" || echo "通知发送失败，但部署成功"

      - name: Notify - Failure
        if: failure()
        run: |
          curl --location "${{ env.NOTIFY_PATH }}" \
          --header 'Content-Type: application/json' \
          --data "{
            \"token\": \"${{ env.NOTIFY_TOKEN }}\",
            \"sendReceiver\": \"master\",
            \"atReceiver\": \"\",
            \"content\": \"⚠️ 真爱粉ai模块(Docker)部署失败，请检查\"
          }" || echo "通知发送失败"
