name: true-love-ai Build & Deploy via Docker

# Pushes to master deploy through true-love-deploy.yml, which runs ai, server and base in order
on:
  workflow_dispatch:
  workflow_call:

env:
  # ========== Docker 镜像配置 ==========
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/true-love-ai
  
  # ========== ser-docker（ser-pve 上的 Debian 虚拟机）部署配置 ==========
  SERVER_IP: ${{ secrets.SER_GW_HOST }}
  SERVER_PORT: 2233
  SERVER_USER: server
  SERVER_SSH_KEY: ${{ secrets.SER_SSH_DOOR_KEY }}
  
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./true-love-ai
          file: ./true-love-ai/Dockerfile
          build-contexts: |
            common=./true-love-common
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=true-love-ai
          cache-to: type=gha,mode=max,scope=true-love-ai
          platforms: linux/amd64

  deploy:
    name: Deploy to ser-docker
    runs-on: ubuntu-latest
    # Shares the ser-docker checkout with the nexu deploy; take turns so two git pulls never race
    concurrency:
      group: deploy-ser-docker
      cancel-in-progress: false
    needs: build-and-push
    environment: production

    steps:
      - name: Fetch config from config-center
        uses: actions/checkout@v4
        with:
          repository: oreoft/config-center
          token: ${{ secrets.CONFIG_CENTER_TOKEN }}
          path: config-center
          persist-credentials: false

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ env.SERVER_SSH_KEY }}

      # The image is public, so the config never goes into it: ship it to the host before the service restarts
      - name: Upload config
        shell: bash
        run: |
          for i in 1 2 3; do
            scp -q -o StrictHostKeyChecking=no -P "${{ env.SERVER_PORT }}" \
              config-center/true-love-n/true-love-ai/config.yaml \
              "${{ env.SERVER_USER }}@${{ env.SERVER_IP }}:.tl-config-true-love-ai.yaml" && exit 0
            echo "scp attempt $i failed; retrying"
            sleep 10
          done
          exit 1

      - name: Deploy via SSH
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=no -p "${{ env.SERVER_PORT }}" "${{ env.SERVER_USER }}@${{ env.SERVER_IP }}" bash -s << 'EOF'
            set -euo pipefail
            cd ~/true-love-n/true-love-ai

            git pull --ff-only

            # Move the uploaded config to where compose mounts it; failing here leaves the running container untouched
            mkdir -p ~/config-center/true-love-n/true-love-ai
            mv -f ~/.tl-config-true-love-ai.yaml ~/config-center/true-love-n/true-love-ai/config.yaml

            docker compose pull
            # Recreate even when the image is unchanged so config-only deploys take effect
            docker compose up -d --force-recreate
            docker image prune -f
            docker compose ps
          EOF

      - name: Notify - Success
        if: success()
        env:
          ALERT_URL: ${{ secrets.ALERT_URL }}
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN }}
          TITLE: "true-love-ai 部署成功"
        run: |
          jq -n \
            --arg title "$TITLE" \
            --arg repo "$GITHUB_REPOSITORY（$GITHUB_REF_NAME · ${GITHUB_SHA::7}）" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{source:"github", level:"info", title:$title, fields:{"仓库":$repo}, url:$url}' \
          | curl -fsS -m 30 "$ALERT_URL" \
              -H "Authorization: Bearer $ALERT_TOKEN" -H 'Content-Type: application/json' -d @- \
          || echo "通知发送失败，但部署成功"

      - name: Notify - Failure
        if: failure()
        env:
          ALERT_URL: ${{ secrets.ALERT_URL }}
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN }}
          TITLE: "true-love-ai 部署失败"
        run: |
          jq -n \
            --arg title "$TITLE" \
            --arg repo "$GITHUB_REPOSITORY（$GITHUB_REF_NAME · ${GITHUB_SHA::7}）" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{source:"github", level:"error", title:$title, fields:{"仓库":$repo}, url:$url}' \
          | curl -fsS -m 30 "$ALERT_URL" \
              -H "Authorization: Bearer $ALERT_TOKEN" -H 'Content-Type: application/json' -d @- \
          || echo "通知发送失败"
