name: true-love-base Deploy to m8s-win, ser-win and gcp-win

# Pushes to master deploy through true-love-deploy.yml, which runs ai, server and base in order
on:
  workflow_dispatch:
    inputs:
      machines:
        description: Comma-separated machines to deploy
        type: string
        default: m8s,ser,gcp-win
  workflow_call:
    inputs:
      machines:
        description: Comma-separated machines to deploy
        type: string
        default: m8s,ser,gcp-win

permissions:
  contents: read
  id-token: write

jobs:
  # Picks the requested machines out of the table below
  targets:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env:
          MACHINES: ${{ inputs.machines || 'm8s,ser,gcp-win' }}
          # ser-win has no public entry; reach it through ser-docker, the one host with a public SSH port
          ALL: >-
            [
              {"machine": "m8s", "host_secret": "M8S_GW_HOST", "key_secret": "M8S_SSH_DOOR_KEY", "user": "admin", "port": 2233},
              {"machine": "ser", "host_secret": "SER_WIN_HOST", "key_secret": "SER_SSH_DOOR_KEY", "user": "admin", "port": 22,
               "jump_host_secret": "SER_GW_HOST", "jump_user": "server", "jump_port": 2233},
              {"machine": "gcp-win", "host_secret": "GCP_WIN_HOST", "key_secret": "GCP_WIN_SSH_KEY", "user": "admin", "port": 22}
            ]
        run: |
          include=$(jq -c --arg m "$MACHINES" '($m | split(",")) as $want | map(select(.machine as $x | $want | index($x)))' <<< "$ALL")
          [ "$include" != "[]" ] || { echo "::error::no known machine in '$MACHINES'"; exit 1; }
          echo "include=$include" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy Base (${{ matrix.machine }})
    needs: targets
    runs-on: ubuntu-latest
    # One deploy per machine at a time; on m8s this queues behind the server deploy, which shares the checkout
    concurrency:
      group: deploy-${{ matrix.machine }}
      cancel-in-progress: false
    environment: production
    # Each machine runs the WeChat account logged in there; base reads which one it is from the machine itself.
    # One failing machine does not stop the others.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.include) }}
    env:
      SERVER_IP: ${{ secrets[matrix.host_secret] }}
      SERVER_USER: ${{ matrix.user }}
      SERVER_PORT: ${{ matrix.port }}
      SERVER_SSH_KEY: ${{ secrets[matrix.key_secret] }}
      # Empty for hosts reached directly
      JUMP_HOST: ${{ matrix.jump_host_secret && secrets[matrix.jump_host_secret] || '' }}
      JUMP_USER: ${{ matrix.jump_user }}
      JUMP_PORT: ${{ matrix.jump_port }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch config from config-center
        uses: actions/checkout@v4
        with:
          repository: oreoft/config-center
          token: ${{ secrets.CONFIG_CENTER_TOKEN }}
          path: config-center
          persist-credentials: false

      - name: Delay
        run: sleep 30

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ env.SERVER_SSH_KEY }}

      # Ship the config to the host; the runner links true-love-base\config.yaml to it on start
      - name: Upload config
        shell: bash
        run: |
          SSH_OPTS=(-o StrictHostKeyChecking=no)
          if [ -n "$JUMP_HOST" ]; then
            SSH_OPTS+=(-o "ProxyCommand=ssh -o StrictHostKeyChecking=no -p $JUMP_PORT -W %h:%p $JUMP_USER@$JUMP_HOST")
          fi
          for i in 1 2 3; do
            scp -q "${SSH_OPTS[@]}" -P "${{ env.SERVER_PORT }}" \
              config-center/true-love-n/true-love-base/config.yaml \
              "${{ env.SERVER_USER }}@${{ env.SERVER_IP }}:.tl-config-true-love-base.yaml" && exit 0
            echo "scp attempt $i failed; retrying"
            sleep 10
          done
          exit 1

      - name: Execute base Commands Over SSH (Windows)
        shell: bash
        run: |
          set -euo pipefail
          echo "SSH env ready"
          SSH_OPTS=(-o StrictHostKeyChecking=no)
          if [ -n "$JUMP_HOST" ]; then
            SSH_OPTS+=(-o "ProxyCommand=ssh -o StrictHostKeyChecking=no -p $JUMP_PORT -W %h:%p $JUMP_USER@$JUMP_HOST")
          fi
          ssh "${SSH_OPTS[@]}" -p ${{ env.SERVER_PORT }} ${{ env.SERVER_USER }}@${{ env.SERVER_IP }} << 'EOF'
            $ErrorActionPreference = "Stop"
            $taskName = "UIA-TL-BASE"
            $repoRoot = Join-Path ([Environment]::GetFolderPath('Desktop')) 'true-love-n'

            Write-Host "Connected to remote server"

            # Install the uploaded config before stopping anything, so a failure here leaves base running
            $configDir = Join-Path ([Environment]::GetFolderPath('Desktop')) 'config-center\true-love-n\true-love-base'
            New-Item -ItemType Directory -Force -Path $configDir | Out-Null
            Move-Item -Force -Path (Join-Path $HOME '.tl-config-true-love-base.yaml') -Destination (Join-Path $configDir 'config.yaml')

            # Pull before stopping anything: if it fails, base keeps running; the task is also (re)registered from these scripts
            git -C $repoRoot pull --ff-only
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            Write-Host "Stopping existing TrueLove-Base task if it is running"
            schtasks /end /tn $taskName
            if ($LASTEXITCODE -ne 0) {
              Write-Host "Task was not running or could not be stopped; continuing"
            }

            # Re-register when the task is missing (fresh machine), does not run the runner in this repo,
            # or still opens a console window (registered before the window was hidden)
            $task = Get-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
            $taskArgs = "$($task.Actions.Arguments)"
            if (-not $task -or $taskArgs -notlike '*\.github\systemd\run-true-love-base.ps1*' -or $taskArgs -notlike '*-WindowStyle Hidden*') {
              Write-Host "Registering $taskName from the repo scripts"
              powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $repoRoot '.github\systemd\create-uia-base.ps1')
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }

            Write-Host "Starting TrueLove-Base task"
            schtasks /run /tn $taskName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            Write-Host "Checking TrueLove-Base task status"
            schtasks /query /tn $taskName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            Write-Host "Deployment script completed"
          EOF

      - name: Notify - Success
        if: success()
        env:
          ALERT_URL: ${{ secrets.ALERT_URL }}
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN }}
          TITLE: "${{ matrix.machine }} 上的 true-love-base 部署成功"
        run: |
          jq -n \
            --arg title "$TITLE" \
            --arg repo "$GITHUB_REPOSITORY（$GITHUB_REF_NAME · ${GITHUB_SHA::7}）" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{source:"github", level:"info", title:$title, fields:{"仓库":$repo}, url:$url}' \
          | curl -fsS -m 30 "$ALERT_URL" \
              -H "Authorization: Bearer $ALERT_TOKEN" -H 'Content-Type: application/json' -d @- \
          || echo "通知发送失败，但部署成功"


## 创建任务（任务不存在时部署会自动执行；需要管理员权限）
## .\.github\systemd\create-uia-base.ps1
#
## 启动任务
## schtasks /run /tn "UIA-TL-BASE"
#
## 停止任务
## schtasks /end /tn "UIA-TL-BASE"
#
## 重启
## schtasks /end /tn "UIA-TL-BASE"; schtasks /run /tn "UIA-TL-BASE"
#
## 查看任务状态
## Get-ScheduledTask -TaskName "UIA-TL-BASE"
#
## 删除任务（方便重新创建）
## Unregister-ScheduledTask -TaskName "UIA-TL-BASE" -Confirm:$false
