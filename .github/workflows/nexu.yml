name: nexu Build & Deploy via Docker

on:
  workflow_dispatch:
  push:
    branches: [ "master" ]
    paths:
      - "nexu/**"
      - ".github/workflows/nexu.yml"

env:
  # ========== Docker 镜像配置 ==========
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/nexu
  
  # ========== ser-docker（ser-pve 上的 Debian 虚拟机）部署配置 ==========
  SERVER_IP: ${{ secrets.SER_GW_HOST }}
  SERVER_PORT: 2233
  SERVER_USER: server
  SERVER_SSH_KEY: ${{ secrets.SER_SSH_DOOR_KEY }}
  
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./nexu
          file: ./nexu/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nexu
          cache-to: type=gha,mode=max,scope=nexu
          platforms: linux/amd64

  deploy:
    name: Deploy to ser-docker
    runs-on: ubuntu-latest
    # Shares the ser-docker checkout with the true-love-ai deploy; take turns so two git pulls never race
    concurrency:
      group: deploy-ser-docker
      cancel-in-progress: false
    needs: build-and-push
    environment: production

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.5.3
        with:
          ssh-private-key: ${{ env.SERVER_SSH_KEY }}

      - name: Deploy via SSH
        shell: bash
        run: |
          ssh -o StrictHostKeyChecking=no -p "${{ env.SERVER_PORT }}" "${{ env.SERVER_USER }}@${{ env.SERVER_IP }}" bash -s << 'EOF'
            set -euo pipefail
            cd ~/true-love-n/nexu

            git pull --ff-only

            docker network inspect tl-net >/dev/null 2>&1 || docker network create tl-net

            docker compose pull
            docker compose up -d
            docker image prune -f
            docker compose ps
          EOF

      - name: Notify - Success
        if: success()
        env:
          ALERT_URL: ${{ secrets.ALERT_URL }}
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN }}
          TITLE: "nexu 部署成功"
        run: |
          jq -n \
            --arg title "$TITLE" \
            --arg repo "$GITHUB_REPOSITORY（$GITHUB_REF_NAME · ${GITHUB_SHA::7}）" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{source:"github", level:"info", title:$title, fields:{"仓库":$repo}, url:$url}' \
          | curl -fsS -m 30 "$ALERT_URL" \
              -H "Authorization: Bearer $ALERT_TOKEN" -H 'Content-Type: application/json' -d @- \
          || echo "通知发送失败，但部署成功"

      - name: Notify - Failure
        if: failure()
        env:
          ALERT_URL: ${{ secrets.ALERT_URL }}
          ALERT_TOKEN: ${{ secrets.ALERT_TOKEN }}
          TITLE: "nexu 部署失败"
        run: |
          jq -n \
            --arg title "$TITLE" \
            --arg repo "$GITHUB_REPOSITORY（$GITHUB_REF_NAME · ${GITHUB_SHA::7}）" \
            --arg url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{source:"github", level:"error", title:$title, fields:{"仓库":$repo}, url:$url}' \
          | curl -fsS -m 30 "$ALERT_URL" \
              -H "Authorization: Bearer $ALERT_TOKEN" -H 'Content-Type: application/json' -d @- \
          || echo "通知发送失败"
