# ============================================
# True Love Server - Docker Compose (Windows + Docker Desktop)
# ============================================
#
# 仓库根目录（本文件的上一级 true-love-n）以 bind mount 挂进容器，
# 路径由本文件位置推导，不依赖 Windows 用户名。
# 配置文件由 CI 部署时从私有仓库 config-center 取出，放到与 true-love-n 同级的 config-center 目录（镜像是公开的，配置不进镜像）。
#
# 使用方式（在本文件所在目录执行）：
#   docker compose pull      # 拉取最新镜像
#   docker compose up -d     # 启动/更新容器
#   docker compose logs -f   # 查看日志
#   docker compose ps        # 查看状态
#   docker compose down      # 停止并删除容器
#
# ============================================

services:
  true-love-server:
    # 镜像地址
    image: ghcr.io/oreoft/true-love-server:latest
    
    # 容器名称
    container_name: tl-server
    
    # 重启策略
    restart: unless-stopped

    # 端口映射（Docker Desktop WSL2 模式下 host 网络无效）
    # 和 AI 部署在同一台机器上，AI 占了 8088，server 对外用 8089
    ports:
      - "8089:8088"

    # 卷挂载
    volumes:
      # 配置目录（CI 写入的、与 true-love-n 同级的 config-center），只读；不存在时直接报错，不自动建空目录
      - type: bind
        source: ../../config-center/true-love-n
        target: /mnt/config-center
        read_only: true
        bind:
          create_host_path: false
      # 本地卷 - SQLite 数据库（不放在 Windows 挂载目录上）：platform.db 加每个机器人一个 <bot_id>.db
      - tl-server-dbs:/app/dbs

    # 启动前把配置文件软链到 /app（服务按工作目录的相对路径读取）
    # 和 base、AI 之间的媒体文件都走 /media URL，不再挂共享目录
    command: >
      /bin/sh -c "
      ln -sfn /mnt/config-center/true-love-server/config.yaml /app/config.yaml &&
      exec python -m true_love_server
      "

    # 环境变量
    environment:
      - APP_ENV=prod
      - TZ=Asia/Shanghai
    
    # 健康检查
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8088/health" ]
      interval: 30s      # 检查间隔
      timeout: 10s       # 超时时间
      retries: 3         # 失败重试次数
      start_period: 10s  # 启动等待时间

# 卷定义
volumes:
  # 本地卷 - SQLite 数据库存储（Docker 管理）
  tl-server-dbs: