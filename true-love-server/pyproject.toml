[project]
name = "true-love-server"
version = "0.2.0"
description = "True Love Server - 真爱粉服务端"
requires-python = ">=3.12"
dependencies = [
    "true-love-common",
    "apscheduler>=3.11.1",
    "bs4>=0.0.2",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-logging-loki>=0.3.1",
    "pydantic>=2.10.0",
    "pillow>=11.0.0",
    "pytz>=2025.2",
    "pyunit-time>=2024.7.3",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "sqlalchemy>=2.0.0",
    "qrcode>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.28.0",  # fastapi TestClient
]

[project.scripts]
true-love-server = "true_love_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/true_love_server"]

[tool.uv.sources]
true-love-common = { path = "../true-love-common", editable = true }

[tool.hatch.build]
sources = ["src"]

[tool.pyright]
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# a test whose coroutine never ran must fail, not pass silently
filterwarnings = ["error::RuntimeWarning", "error::pytest.PytestUnraisableExceptionWarning"]
