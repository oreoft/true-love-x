<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>tl-admin</title>
    <link rel="stylesheet" href="/static/tl-admin.css">
</head>
<body>
<!--
  tl-admin：所有机器人共用的后台，放在 server 上。
  顶栏切换当前机器人；左侧导航分「全部 bot / 当前 bot / 平台」三段，渠道专属的菜单按 server 返回的能力列表显示。
  页面状态在 URL 里：#/overview、#/bot/<bot_id>/<页面>、#/skills、#/logs。
-->
<header class="top">
    <div class="brand">tl-admin</div>
    <div class="switcher">
        <button class="sw-btn" id="swBtn" aria-haspopup="true" aria-expanded="false"></button>
        <div class="sw-menu" id="swMenu" hidden></div>
    </div>
</header>

<div class="shell">
    <nav id="nav" aria-label="主导航"></nav>
    <main id="main"></main>
</div>
<div id="modalRoot"></div>
<div class="toast" id="toast" hidden></div>

<script type="module" src="/static/js/main.js"></script>
</body>
</html>
